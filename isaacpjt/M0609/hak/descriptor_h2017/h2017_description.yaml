# Lula robot descriptor — Doosan H2017
# h2017.usd 의 조인트 로컬 프레임에서 생성한 urdf_h2017/h2017.urdf 와 짝을 이룬다.
# 충돌구는 링크 기하(상완 845 / 전완 734 / 손목 121 mm)에 맞춘 근사값이다.

api_version: 1.0

cspace:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6

root_link: base_link

# 팔레타이징 기본 자세 — 팔을 세우고 손목을 아래로
default_q: [0.0, -1.0472, 1.7453, 0.0, 1.0472, 0.0]

acceleration_limits: [6.0, 6.0, 8.0, 10.0, 10.0, 10.0]
jerk_limits: [3000.0, 3000.0, 4000.0, 5000.0, 5000.0, 5000.0]

collision_spheres:
    - base_link:
        - "center": [0.0, 0.0, 0.10]
          "radius": 0.16
        - "center": [0.0, 0.0, 0.26]
          "radius": 0.15
    - link_1:
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.15
    - link_2:
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.14
        - "center": [0.21, 0.0, 0.0]
          "radius": 0.13
        - "center": [0.42, 0.0, 0.0]
          "radius": 0.13
        - "center": [0.63, 0.0, 0.0]
          "radius": 0.13
        - "center": [0.845, 0.0, 0.0]
          "radius": 0.13
    - link_3:
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.12
        - "center": [0.0, -0.18, 0.0]
          "radius": 0.11
        - "center": [0.0, -0.37, 0.0]
          "radius": 0.11
        - "center": [0.0, -0.55, 0.0]
          "radius": 0.11
        - "center": [0.0, -0.734, 0.0]
          "radius": 0.11
    - link_4:
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.10
    - link_5:
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.09
        - "center": [0.0, -0.06, 0.0]
          "radius": 0.09
    - link_6:
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.07
